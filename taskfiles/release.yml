---
version: "3"

tasks:
  build-push:
    desc: Build and push one arbor service image with an explicit semver tag
    requires:
      vars: [SERVICE]
    cmds:
      - |
        set -euo pipefail
        if [ -z "${IMAGE_TAG:-}" ]; then
          echo "IMAGE_TAG is required for release builds" >&2
          exit 1
        fi
        case "${IMAGE_TAG}" in
          v[0-9]*.[0-9]*.[0-9]*)
            ;;
          *)
            echo "IMAGE_TAG must be semver vX.Y.Z, got: ${IMAGE_TAG}" >&2
            exit 1
            ;;
        esac
        echo "Release build-push ${SERVICE}:${IMAGE_TAG}"
      - task: "{{.SERVICE}}:build"
      - task: "{{.SERVICE}}:push"
