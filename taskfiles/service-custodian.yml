---
version: "3"

tasks:
  build:
    desc: Build custodian Docker image
    dir: "{{.ROOT_DIR}}"
    vars:
      IMAGE_TAG:
        sh: |
          if [ -n "${IMAGE_TAG:-}" ]; then
            echo "${IMAGE_TAG}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TS=$(date -u +%s)
            echo "main-${SHORT_SHA}-${TS}"
          fi
      VERSION:
        sh: echo "${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || git rev-parse --abbrev-ref HEAD)}"
      COMMIT:
        sh: echo "${COMMIT:-$(git rev-parse HEAD)}"
      BUILD_DATE:
        sh: echo "${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}"
    cmds:
      - |
        echo "Building custodian:{{.IMAGE_TAG}}"
        echo "  VERSION={{.VERSION}}"
        echo "  COMMIT={{.COMMIT}}"
        echo "  BUILD_DATE={{.BUILD_DATE}}"
        docker build \
          --build-arg VERSION={{.VERSION}} \
          --build-arg COMMIT={{.COMMIT}} \
          --build-arg BUILD_DATE={{.BUILD_DATE}} \
          -t {{.IMAGE_URL}}/custodian:{{.IMAGE_TAG}} \
          ./services/custodian
        echo "Build complete: {{.IMAGE_URL}}/custodian:{{.IMAGE_TAG}}"

  push:
    desc: Push custodian Docker image
    dir: "{{.ROOT_DIR}}"
    vars:
      IMAGE_TAG:
        sh: |
          if [ -n "${IMAGE_TAG:-}" ]; then
            echo "${IMAGE_TAG}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TS=$(date -u +%s)
            echo "main-${SHORT_SHA}-${TS}"
          fi
    cmds:
      - |
        echo "Pushing custodian:{{.IMAGE_TAG}}"
        docker push {{.IMAGE_URL}}/custodian:{{.IMAGE_TAG}}
        echo "Push complete: {{.IMAGE_URL}}/custodian:{{.IMAGE_TAG}}"

  pause:
    desc: "pause the custodian deployment"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - flux suspend kustomization services --namespace flux-system
      - kubectl scale deployment/custodian -n forestrie-dev --replicas=0

  resume:
    desc: "resume the custodian deployment"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - kubectl scale deployment/custodian -n forestrie-dev --replicas=1
      - flux resume kustomization services --namespace flux-system
