---
version: "3"

tasks:
  set-secrets:
    desc: Set GitHub Actions secrets from .secret.env.ranger
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        if [ ! -f .secret.env.ranger ]; then
          echo "Error: .secret.env.ranger not found in repository root"
          exit 1
        fi

        # Source the env file and validate required variables
        set -a
        source .secret.env.ranger
        set +a

        if [ -z "QUEUE_URL" ]; then
          echo "Error: QUEUE_URL must be set in .secret.env.ranger"
          exit 1
        fi

        if [ -z "$QUEUE_TOKEN" ]; then
          echo "Error: QUEUE_TOKEN must be set in .secret.env.ranger"
          exit 1
        fi

        echo "Setting GitHub Actions secrets..."
        gh secret set QUEUE_URL --body "$QUEUE_URL"
        gh secret set QUEUE_TOKEN --body "$QUEUE_TOKEN"
        echo "Secrets updated successfully"

  build:
    desc: Build ranger Docker image
    dir: "{{.ROOT_DIR}}"
    vars:
      IMAGE_TAG:
        sh: |
          if [ -n "${IMAGE_TAG:-}" ]; then
            echo "${IMAGE_TAG}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TS=$(date -u +%s)
            echo "main-${SHORT_SHA}-${TS}"
          fi
      VERSION:
        sh: echo "${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || git rev-parse --abbrev-ref HEAD)}"
      COMMIT:
        sh: echo "${COMMIT:-$(git rev-parse HEAD)}"
      BUILD_DATE:
        sh: echo "${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}"
    cmds:
      - |
        echo "Building ranger:{{.IMAGE_TAG}}"
        echo "  VERSION={{.VERSION}}"
        echo "  COMMIT={{.COMMIT}}"
        echo "  BUILD_DATE={{.BUILD_DATE}}"
        docker build \
          --build-arg VERSION={{.VERSION}} \
          --build-arg COMMIT={{.COMMIT}} \
          --build-arg BUILD_DATE={{.BUILD_DATE}} \
          -t {{.IMAGE_URL}}/ranger:{{.IMAGE_TAG}} \
          -f ./services/ranger/Dockerfile \
          ./services
        echo "Build complete: {{.IMAGE_URL}}/ranger:{{.IMAGE_TAG}}"

  pause:
    desc: "pause the services"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - flux suspend kustomization ranger --namespace flux-system
      - kubectl scale deployment/ranger -n forestrie-arbor --replicas=0

  resume:
    desc: "resume the services"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - kubectl scale deployment/ranger -n forestrie-arbor --replicas=1
      - flux resume kustomization ranger --namespace flux-system

  peek:msg:
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        source .secret.env.ranger
        # https://api.cloudflare.com/client/v4/accounts/68f25af297c4235c3f1c47b2f73925b0/queues/5b0ba7f4ce3e4c688d4094d448e48edc
        echo curl -v -X POST \
          "$QUEUE_URL/messages/peek" \
            -H "Authorization: Bearer $QUEUE_TOKEN" -H "Content-Type: application/json" -d "{\"batch_size\":1}"
        curl -v -X POST \
          "$QUEUE_URL/messages/peek" \
            -H "Authorization: Bearer $QUEUE_TOKEN" -H "Content-Type: application/json" -d '{"batch_size":1}'

  pull:msg:
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        source .secret.env.ranger
        # https://api.cloudflare.com/client/v4/accounts/68f25af297c4235c3f1c47b2f73925b0/queues/5b0ba7f4ce3e4c688d4094d448e48edc
        echo curl -v -X POST \
          "$QUEUE_URL/messages/pull" \
            -H "Authorization: Bearer $QUEUE_TOKEN" -H "Content-Type: application/json" -d "{\"batch_size\":1}"
        curl -v -X POST \
          "$QUEUE_URL/messages/pull" \
        -H "Authorization: Bearer $QUEUE_TOKEN" -H "Content-Type: application/json" -d '{"batch_size":1, "visibility_timeout_ms": 1000}'

  push:
    desc: Push ranger Docker image
    dir: "{{.ROOT_DIR}}"
    vars:
      IMAGE_TAG:
        sh: |
          if [ -n "${IMAGE_TAG:-}" ]; then
            echo "${IMAGE_TAG}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TS=$(date -u +%s)
            echo "main-${SHORT_SHA}-${TS}"
          fi
    cmds:
      - |
        echo "Pushing ranger:{{.IMAGE_TAG}}"
        docker push {{.IMAGE_URL}}/ranger:{{.IMAGE_TAG}}
        echo "Push complete: {{.IMAGE_URL}}/ranger:{{.IMAGE_TAG}}"

  # DEPRECATED: deploy task has been replaced by Flux GitOps deployment
  # Deployment is now automated via Flux GitOps when images are pushed to Artifact Registry.
  # See: docs/adr-001-flux-gitops-deployment.md
  #
  # For emergency manual deployment, use:
  #   kubectl apply -k ./services/ranger/k8s
  #   kubectl create secret generic ranger-secrets --from-literal=queue-api-token="..." -n forestrie-arbor
