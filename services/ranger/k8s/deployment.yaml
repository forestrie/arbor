apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranger
  labels:
    app: ranger
    component: queue-consumer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ranger
  template:
    metadata:
      labels:
        app: ranger
        component: queue-consumer
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: ranger
        image: europe-west2-docker.pkg.dev/forest-dev-1/forestrie/ranger:IMAGE_TAG
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9090
          protocol: TCP
        env:
        - name: PORT
          value: "9090"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ranger-config
              key: log-level
        - name: POLL_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: ranger-config
              key: poll-interval
        - name: VISIBILITY_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: ranger-config
              key: visibility-timeout
        - name: SHUTDOWN_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: ranger-config
              key: shutdown-timeout
        - name: RANGER_QUEUE_URL
          valueFrom:
            secretKeyRef:
              name: ranger-secrets
              key: queue-url
        - name: RANGER_QUEUE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: ranger-secrets
              key: queue-api-token
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ranger-config
  labels:
    app: ranger
data:
  log-level: "info"
  poll-interval: "5s"
  visibility-timeout: "30s"
  shutdown-timeout: "30s"
