apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forestrie-arbor
resources:
  - deployment.yaml
  - service.yaml
commonLabels:
  app: ranger
  component: queue-consumer
images:
  - name: europe-west2-docker.pkg.dev/forest-dev-1/forestrie/ranger
    newTag: main-8a7bc0c-180 # {"$imagepolicy": "flux-system:ranger:tag"}
configMapGenerator:
  - name: ranger-config
    literals:
      - log-level=info
      - poll-interval=5s
      - visibility-timeout=30s
      - shutdown-timeout=30s
