apiVersion: apps/v1
kind: Deployment
metadata:
  name: shard-operator
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: shard-operator }
  template:
    metadata:
      labels: { app: shard-operator }
    spec:
      serviceAccountName: shard-operator
      containers:
        - name: manager
          <<< FIX ME >>>>
          image: ghcr.io/you/shard-operator:TAG
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-bind-address=:8080
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
