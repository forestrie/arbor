---
version: "3"

vars:
  IMAGE_URL: europe-west2-docker.pkg.dev/forest-dev-1/forestrie
  CLUSTER_NAME: forest-dev-1
  CLUSTER_ZONE: europe-west2-a

includes:
  minio:
    taskfile: taskfiles/minio.yml
    optional: true
    dir: .
  ranger:
    taskfile: taskfiles/service-ranger.yml
    dir: .
  scout:
    taskfile: taskfiles/service-scout.yml
    dir: .
  sealer:
    taskfile: taskfiles/service-sealer.yml
    dir: .
tasks:
  registry-auth:
    desc: Configure Docker authentication for Artifact Registry
    cmds:
      - gcloud auth configure-docker europe-west2-docker.pkg.dev

  cluster-auth:
    desc: Authenticate to GKE cluster
    cmds:
      - gcloud container clusters get-credentials {{.CLUSTER_NAME}} --zone={{.CLUSTER_ZONE}}

  gcp-auth:
    desc: Authenticate to GCP (both Artifact Registry and GKE)
    cmds:
      - task: registry-auth
      - task: cluster-auth

  bootstrap:
    desc: bootstrap the development environment
    cmds:
      - |
        export GIT_BOOTSTRAP_SH=$(curl -fsSL https://raw.githubusercontent.com/robinbryce/git-bootstrap/refs/heads/main/git-bootstrap.v2.sh)

        # Ranger bootstrap (shared clones under services/_deps)
        mkdir -p services/_deps
        (cd services/ranger && sh -c "$GIT_BOOTSTRAP_SH" - dirs . && sh -c "$GIT_BOOTSTRAP_SH" - clone . && sh -c "$GIT_BOOTSTRAP_SH" - checkout .)

        # Always (re)generate go.work since it's gitignored and should match the current layout.
        cat <<EOF > services/ranger/go.work
        go 1.24.4
        use (
          ./src
          ../_deps/go-datatrails-common
          ../_deps/go-datatrails-serialization/eventsv1
          ../_deps/go-datatrails-simplehash
          ../_deps/go-merklelog-azure
          ../_deps/go-merklelog-datatrails
          ../_deps/go-merklelog-fs
          ../_deps/go-merklelog-provider-testing
          ../_deps/go-merklelog/massifs
          ../_deps/go-merklelog/mmr
          ../_deps/go-sigv4
        )
        EOF

        # New sealer bootstrap (shared clones under services/_deps)
        mkdir -p services/_deps
        (cd services/sealer && sh -c "$GIT_BOOTSTRAP_SH" - dirs . && sh -c "$GIT_BOOTSTRAP_SH" - clone . && sh -c "$GIT_BOOTSTRAP_SH" - checkout .)

        # Always (re)generate go.work since it's gitignored and should match the current layout.
        cat <<EOF > services/sealer/go.work
        go 1.24.4
        use (
          ./src
          ../_deps/go-datatrails-common
          ../_deps/go-datatrails-serialization/eventsv1
          ../_deps/go-datatrails-simplehash
          ../_deps/go-merklelog-azure
          ../_deps/go-merklelog-datatrails
          ../_deps/go-merklelog-fs
          ../_deps/go-merklelog-provider-testing
          ../_deps/go-merklelog/massifs
          ../_deps/go-merklelog/mmr
          ../_deps/go-sigv4
        )
        EOF

  test:
    desc: run all the tests
    cmds:
      - task: test:unit
      - task: test:integration

  test:unit:
    desc: run unit tests
    vars:
      GO_TEST_TAGS: '{{.GO_TEST_TAGS | default ""}}'
      GO_MOD_DIRS:
        sh: find services -type f -name 'go.mod' ! -path 'services/_deps/*/*'
    cmds:
      - for: { var: GO_MOD_DIRS, as: MODULE }
        cmd: |
          MOD_DIR=$(dirname {{.MODULE}})
          if [ -f "$(pwd)/$MOD_DIR/../go.work" ]; then
            export GOWORK="$(pwd)/$MOD_DIR/../go.work"
          else
            unset GOWORK
          fi
          cd "$MOD_DIR"

          go test \
            {{.GO_TEST_TAGS}} \
            -race \
            -v \
            ./...
          exit 0

  test:integration:
    desc: run the integration tests
    vars:
      GO_TEST_TAGS: '{{.GO_TEST_TAGS | default "-tags integration"}}'
      # sh: find services -type f -name 'go.mod'
    cmds:
      - task: minio:start
      - |
        export GOWORK="$(pwd)/services/ranger/go.work"
        cd services/ranger/src/tests && go test {{.GO_TEST_TAGS}}  -race  -v ./...
