---
version: "3"

vars:
  IMAGE_URL: europe-west2-docker.pkg.dev/forest-dev-1/forestrie
  CLUSTER_NAME: forest-dev-1
  CLUSTER_REGION: europe-west2

includes:
  minio:
    taskfile: ../taskfiles/Taskfile_minio.yml
    optional: true
    dir: .
  ranger:
    taskfile: taskfiles/service-ranger.yml
    dir: .

tasks:
  registry-auth:
    desc: Configure Docker authentication for Artifact Registry
    cmds:
      - gcloud auth configure-docker europe-west2-docker.pkg.dev

  cluster-auth:
    desc: Authenticate to GKE cluster
    cmds:
      - gcloud container clusters get-credentials {{.CLUSTER_NAME}} --region={{.CLUSTER_REGION}}

  gcp-auth:
    desc: Authenticate to GCP (both Artifact Registry and GKE)
    cmds:
      - task: registry-auth
      - task: cluster-auth

  bootstrap:
    desc: bootstrap the development environment
    cmds:
      - |
        export GIT_BOOTSTRAP_SH=$(curl -fsSL https://raw.githubusercontent.com/robinbryce/git-bootstrap/refs/heads/main/git-bootstrap.v2.sh)
        sh -c "$GIT_BOOTSTRAP_SH" - clone .
        sh -c "$GIT_BOOTSTRAP_SH" - checkout .
        echo "-- $(pwd)"
        tree -d
        echo "-- parent dir"
        pushd ..
        tree -d
        ls -lad *
        pwd
        popd
        pwd

        if [ -f ../go.work ]; then
          echo "go.work exists, you may need to update it"
        else
        cat <<EOF > ../go.work
        go 1.24.4
        use (
        	./go-datatrails-common
        	./go-merklelog-datatrails
        	./go-merklelog/massifs
        	./go-merklelog/mmr
        	./go-datatrails-serialization/eventsv1
        	./go-merklelog-azure
        	./go-merklelog-fs
        	./go-merklelog-provider-testing
        )
        EOF
        fi
        exit 0

  test:
    desc: run all the tests
    cmds:
      - task: test:unit
      - task: test:integration

  test:unit:
    desc: run unit tests
    vars:
      GO_TEST_TAGS: '{{.GO_TEST_TAGS | default ""}}'
      GO_MOD_DIRS:
        sh: find . -type f -name 'go.mod'
    cmds:
      - for: { var: GO_MOD_DIRS, as: MODULE }
        cmd: |
          cd $(dirname {{.MODULE}})

          go test \
            {{.GO_TEST_TAGS}} \
            -race \
            -v \
            ./...
          exit 0

  test:integration:
    desc: run the integration tests
    vars:
      GO_TEST_TAGS: '{{.GO_TEST_TAGS | default "-tags integration"}}'
      # sh: find services -type f -name 'go.mod'
    cmds:
      - task: minio:start
      - cd services/ranger/tests && go test {{.GO_TEST_TAGS}}  -race  -v ./...
