      - name: Trigger arbor-flux to sync service secrets
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Create the complete request body as JSON to avoid quotation/encoding issues
          cat > /tmp/dispatch_request.json << EOF
          {
            "event_type": "sync-services-secrets",
            "client_payload": {
              "source": "arbor",
              "workflow": "build-deploy",
              "run_id": "${{ github.run_id }}",
              "sha": "${{ github.sha }}"
            }
          }
          EOF

          # Trigger arbor-flux workflow to sync service secrets after build
          gh api repos/forestrie/arbor-flux/dispatches \
            --method POST \
            --input /tmp/dispatch_request.json
