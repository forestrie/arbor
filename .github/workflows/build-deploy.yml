name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "services/ranger/.env.bootstrap"
      - "Taskfile.dist.yml"
      - "taskfiles/**"
      - "services/**"
      - ".github/workflows/build-deploy.yml"

  # Bootstrap / operators: push images after forest-1 Phase 4 syncs GitHub variables
  # (see forest-1 docs/bootstrap-arbor-ci.md). Uses repo Variables (WIF, registry URL).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  # Note: GitHub App token will be used for cross-repo operations

jobs:
  build-and-deploy:
    # head_commit exists on push; skip message check for workflow_dispatch
    if: github.actor != 'fluxcdbot' && (github.event_name != 'push' || !contains(github.event.head_commit.message, 'Update from image update automation'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.45.5
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The bootstrap clones private forestrie repos (go-univocity); the
      # job's GITHUB_TOKEN only covers this repo, so mint a forestrie-cd app
      # token and route https github clones through it.
      - name: Mint GitHub App token for private dep clones
        id: gitapp
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ vars.GITAPP_ID }}
          private_key: ${{ secrets.GITAPP_PRIVATE_KEY }}

      - name: Git Bootstrap
        run: |
          git config --global url."https://x-access-token:${{ steps.gitapp.outputs.token }}@github.com/".insteadOf "https://github.com/"
          task bootstrap
          git config --global --unset-all url."https://x-access-token:${{ steps.gitapp.outputs.token }}@github.com/".insteadOf

      # publishproof's tracer-bullet test publishes against anvil; without
      # foundry installed the test self-skips and the extend path is untested.
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Unit Tests
        run: |
          task test:unit

      - name: Integration Tests
        run: |
          task test:integration

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev

      - name: Compute image tag
        id: vars
        run: echo "image_tag=main-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build Ranger Image
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: task ranger:build IMAGE_TAG=${IMAGE_TAG} BUILD_DATE=${BUILD_DATE}

      - name: Build Scout Image
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: task scout:build IMAGE_TAG=${IMAGE_TAG} BUILD_DATE=${BUILD_DATE}

      - name: Build Sealer Image
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: task sealer:build IMAGE_TAG=${IMAGE_TAG} BUILD_DATE=${BUILD_DATE}

      - name: Build Publisher Image
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: task publisher:build IMAGE_TAG=${IMAGE_TAG} BUILD_DATE=${BUILD_DATE}

      - name: Build Custodian Image
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: task custodian:build IMAGE_TAG=${IMAGE_TAG} BUILD_DATE=${BUILD_DATE}

      - name: Build Univocity Image
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: task univocity:build IMAGE_TAG=${IMAGE_TAG} BUILD_DATE=${BUILD_DATE}

      - name: Push Ranger Image
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: task ranger:push IMAGE_TAG=${IMAGE_TAG}

      - name: Push Scout image
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: task scout:push IMAGE_TAG=${IMAGE_TAG}

      - name: Push Sealer image
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: task sealer:push IMAGE_TAG=${IMAGE_TAG}

      - name: Push Publisher image
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: task publisher:push IMAGE_TAG=${IMAGE_TAG}

      - name: Push Custodian image
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: task custodian:push IMAGE_TAG=${IMAGE_TAG}

      - name: Push Univocity image
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: task univocity:push IMAGE_TAG=${IMAGE_TAG}
