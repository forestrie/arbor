name: Release

# Semver v* tag: mark the images already built for the tagged commit, then
# publish the GitHub Release. Ledger-b GitOps bumps are owned by
# release-orchestrator (FOR-254 / ARC-0025). Orchestrator may dispatch
# workflow_dispatch from main (ADR-0043) with patch-bump tag creation.
#
# NOTHING HERE BUILDS AN IMAGE (FOR-611, devdocs plan-2610-05 D1). Both
# paths run `task release:retag`, which finds the `main-<sha7>-<run>` images
# build-deploy pushed for the tagged commit and adds `vX.Y.Z` to those same
# digests. This job used to rebuild all six images as `vX.Y.Z`; the rebuild
# differed in VERSION and BUILD_DATE, so the digest promoted to lane B was
# one lane A had never run, and release-orchestrator could not prove by
# digest that lane A ran the manifest it qualified. A commit with no main-*
# image fails the release by name. There is deliberately no fallback
# rebuild: it would mint exactly the unqualifiable digest this removes.
#
# No unit or integration tests here either: build-deploy ran both on this
# commit before it pushed the images being tagged, and a retag adds no code.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      skip_cross_repo_tests:
        description: Accepted for the ADR-0043 contract; unused in arbor release
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    # secret-egress-ok: exports only `version`, a semver tag parsed from the ref
    # secrets.GITHUB_TOKEN is a setup-task repo-token and never reaches an
    # output. See devdocs plan-2608-04.
    name: Tag release images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # retag polls up to 30 min for build-deploy on the same commit, which is
    # usually still running when auto-tag pushes the tag.
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and validate semver tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/}"
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Release tag must be semver vX.Y.Z (optional prerelease/build metadata), got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The commit the tag names, peeled: `^{commit}` is right for both a
      # lightweight tag (auto-tag's) and an annotated one, where the tag
      # object's own SHA would match no image.
      - name: Resolve the tagged commit
        id: commit
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse "refs/tags/${TAG}^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT || format('{0}-github-ci@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID || 'forest-dev-1') }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Tag the commit's main-* images as the release
        env:
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.commit.outputs.sha }}
        run: task release:retag VERSION="$RELEASE_VERSION" COMMIT="$RELEASE_COMMIT"

  # FOR-532. The frontier resolver reads GitHub *Releases*, not git tags:
  # `fetchLatestReleaseTag` and `fetchSemverReleaseTags` both call
  # `GET /repos/{owner}/{repo}/releases` and match `tag_name`
  # (release-orchestrator/packages/resolver/src/github-releases.ts). Release
  # creation used to live only in `orchestrator-release` below, which is gated
  # to `workflow_dispatch` — so once auto-tag started cutting tags on merge
  # (plan 2608-06 Phase 2) the tags appeared, this workflow ran, and the
  # frontier never advanced, because no Release was ever attached. v0.1.26 was
  # the first tag to land in that hole.
  #
  # arbor attaches no assets: its release carries the service ref and docker tag
  # only, and `config/repos.jsonc` declares `"kits": []`. The tag_name is the
  # whole payload.
  publish-github-release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block, so this names
    # everything it needs and nothing more: no id-token here.
    permissions:
      contents: write
    steps:
      # No checkout and no tag creation. The tag already exists — auto-tag
      # pushed it — and two cutters on one namespace is its own defect.
      - name: Publish GitHub Release for the pushed tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          : "${TAG:?build job produced no version}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists — nothing to do"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "Released from tag ${TAG}, cut by auto-tag on merge to main."
            echo "created GitHub Release ${TAG}"
          fi
          # The assertion that catches the silence: a tag whose Release is
          # missing is invisible to qualification, so prove it is readable the
          # way the resolver will read it rather than trusting the create.
          #
          # POLL, don't check once. The /releases LIST endpoint is eventually
          # consistent: on the first live run of this job it returned 0 matches
          # roughly half a second after `gh release create` had printed the
          # release URL, so a single check failed a release that was in fact
          # published. The assertion still means what it should — if the
          # Release never becomes visible to the call the resolver makes, this
          # fails loudly rather than leaving a tag nothing can resolve.
          found=0
          for attempt in 1 2 3 4 5 6; do
            got=$(gh api "/repos/${{ github.repository }}/releases?per_page=100" \
                    --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
            if [ "$got" = "1" ]; then
              found=1
              echo "verified on attempt ${attempt}: ${TAG} is listed by /releases"
              break
            fi
            echo "attempt ${attempt}: ${TAG} not yet listed by /releases (found ${got}); retrying"
            sleep 5
          done
          if [ "$found" != "1" ]; then
            echo "::error::Release ${TAG} never appeared in /releases after ~30s — the frontier resolver would not see this release" >&2
            exit 1
          fi

  orchestrator-release:
    # secret-egress-ok: exports only `version`, a semver tag computed from tags
    # The GITHUB_TOKEN and the forestrie-cd app key serve dependency clones
    # only; neither reaches an output. See devdocs plan-2608-04.
    name: Orchestrator release (main)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute patch-bump release tag
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -1)
          if [ -z "$latest" ]; then
            version="v0.1.0"
          else
            base="${latest#v}"
            IFS=. read -r major minor patch <<< "${base%%-*}"
            patch=$((patch + 1))
            version="v${major}.${minor}.${patch}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Invalid computed version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The commit checked out, not github.sha: `ref: main` resolves when
      # the job starts, so if main moved after dispatch the two differ. The
      # tag below is created on HEAD, so HEAD is the commit to mark.
      - name: Resolve the release commit
        id: commit
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT || format('{0}-github-ci@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID || 'forest-dev-1') }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Same retag as the tag-push path, and before the tag exists: if the
      # commit has no main-* image this fails here, and no tag or Release
      # is created for images that were never marked.
      - name: Tag the commit's main-* images as the release
        env:
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.commit.outputs.sha }}
        run: task release:retag VERSION="$RELEASE_VERSION" COMMIT="$RELEASE_COMMIT"

      - name: Write release fragment
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ORCH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg tag "$VERSION" \
            --arg sha "${{ steps.commit.outputs.sha }}" \
            --arg ref "main" \
            --arg orchestratorRunId "$ORCH_RUN_ID" \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schemaVersion: 3,
              repo: $repo,
              ref: $ref,
              tag: $tag,
              sha: $sha,
              orchestratorRunId: $orchestratorRunId,
              capturedAt: $capturedAt,
              services: {
                arbor: { repo: "forestrie/arbor", ref: $tag, dockerTag: $tag }
              }
            }' > release-metadata/release-fragment.jsonc
          cat release-metadata/release-fragment.jsonc

      - name: Upload release fragment
        uses: actions/upload-artifact@v4
        with:
          name: release-fragment
          path: release-metadata/release-fragment.jsonc
          retention-days: 90
          if-no-files-found: error

      - name: Create annotated tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping tag push"
          else
            git tag -a "$TAG" -m "Orchestrator release $TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Manually dispatched release (run ${{ github.run_id }})."
          fi
