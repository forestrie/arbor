name: Release

# Semver v* tag: build, test, and publish images only. Ledger-b GitOps bumps
# are owned by release-orchestrator (FOR-254 / ARC-0025). Orchestrator may
# dispatch workflow_dispatch from main (ADR-0043) with patch-bump tag creation.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      orchestrator_run_id:
        description: Correlation id from release-orchestrator release.yml
        required: true
        type: string
      skip_cross_repo_tests:
        description: Accepted for ADR-0043 contract; unused in arbor release
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    # secret-egress-ok: exports only `version`, a semver tag parsed from the ref
    # secrets.GITHUB_TOKEN is a setup-task repo-token and never reaches an
    # output. See devdocs plan-2608-04.
    name: Build Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and validate semver tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/}"
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Release tag must be semver vX.Y.Z (optional prerelease/build metadata), got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The bootstrap clones private forestrie repos (go-univocity); the
      # job's GITHUB_TOKEN only covers this repo, so mint a forestrie-cd app
      # token and route https github clones through it (matches
      # build-deploy.yml).
      - name: Mint GitHub App token for private dep clones
        id: gitapp
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ vars.GITAPP_ID }}
          private_key: ${{ secrets.GITAPP_PRIVATE_KEY }}

      - name: Git Bootstrap
        run: |
          git config --global url."https://x-access-token:${{ steps.gitapp.outputs.token }}@github.com/".insteadOf "https://github.com/"
          task bootstrap
          git config --global --unset-all url."https://x-access-token:${{ steps.gitapp.outputs.token }}@github.com/".insteadOf

      - name: Unit Tests
        run: task test:unit

      - name: Integration Tests
        run: task test:integration

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT || format('{0}-github-ci@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID || 'forest-dev-1') }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev

      - name: Build and push release images
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: |
          set -euo pipefail
          for service in ranger scout sealer custodian univocity publisher; do
            task release:build-push SERVICE="$service"
          done

  # FOR-532. The frontier resolver reads GitHub *Releases*, not git tags:
  # `fetchLatestReleaseTag` and `fetchSemverReleaseTags` both call
  # `GET /repos/{owner}/{repo}/releases` and match `tag_name`
  # (release-orchestrator/packages/resolver/src/github-releases.ts). Release
  # creation used to live only in `orchestrator-release` below, which is gated
  # to `workflow_dispatch` — so once auto-tag started cutting tags on merge
  # (plan 2608-06 Phase 2) the tags appeared, this workflow ran, and the
  # frontier never advanced, because no Release was ever attached. v0.1.26 was
  # the first tag to land in that hole.
  #
  # arbor attaches no assets: its release carries the service ref and docker tag
  # only, and `config/repos.jsonc` declares `"kits": []`. The tag_name is the
  # whole payload.
  publish-github-release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block, so this names
    # everything it needs and nothing more: no id-token here.
    permissions:
      contents: write
    steps:
      # No checkout and no tag creation. The tag already exists — auto-tag
      # pushed it — and two cutters on one namespace is its own defect.
      - name: Publish GitHub Release for the pushed tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          : "${TAG:?build job produced no version}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists — nothing to do"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "Released from tag ${TAG}, cut by auto-tag on merge to main."
            echo "created GitHub Release ${TAG}"
          fi
          # The assertion that catches the silence: a tag whose Release is
          # missing is invisible to qualification, so prove it is readable the
          # way the resolver will read it rather than trusting the create.
          got=$(gh api "/repos/${{ github.repository }}/releases?per_page=100" \
                  --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
          if [ "$got" != "1" ]; then
            echo "::error::Release ${TAG} is not listed by /releases (found ${got}) — the frontier resolver would not see this release" >&2
            exit 1
          fi
          echo "verified: ${TAG} is listed by /releases"

  orchestrator-release:
    # secret-egress-ok: exports only `version`, a semver tag computed from tags
    # The GITHUB_TOKEN and the forestrie-cd app key serve dependency clones
    # only; neither reaches an output. See devdocs plan-2608-04.
    name: Orchestrator release (main)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute patch-bump release tag
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -1)
          if [ -z "$latest" ]; then
            version="v0.1.0"
          else
            base="${latest#v}"
            IFS=. read -r major minor patch <<< "${base%%-*}"
            patch=$((patch + 1))
            version="v${major}.${minor}.${patch}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Invalid computed version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The bootstrap clones private forestrie repos (go-univocity); the
      # job's GITHUB_TOKEN only covers this repo, so mint a forestrie-cd app
      # token and route https github clones through it (matches
      # build-deploy.yml).
      - name: Mint GitHub App token for private dep clones
        id: gitapp
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ vars.GITAPP_ID }}
          private_key: ${{ secrets.GITAPP_PRIVATE_KEY }}

      - name: Git Bootstrap
        run: |
          git config --global url."https://x-access-token:${{ steps.gitapp.outputs.token }}@github.com/".insteadOf "https://github.com/"
          task bootstrap
          git config --global --unset-all url."https://x-access-token:${{ steps.gitapp.outputs.token }}@github.com/".insteadOf

      - name: Unit Tests
        run: task test:unit

      - name: Integration Tests
        run: task test:integration

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT || format('{0}-github-ci@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID || 'forest-dev-1') }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev

      - name: Build and push release images
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DATE: ${{ github.run_started_at }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: |
          set -euo pipefail
          for service in ranger scout sealer custodian univocity publisher; do
            task release:build-push SERVICE="$service"
          done

      - name: Write release fragment
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ORCH_RUN_ID: ${{ github.event.inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg tag "$VERSION" \
            --arg sha "${{ github.sha }}" \
            --arg ref "main" \
            --arg orchestratorRunId "$ORCH_RUN_ID" \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schemaVersion: 3,
              repo: $repo,
              ref: $ref,
              tag: $tag,
              sha: $sha,
              orchestratorRunId: $orchestratorRunId,
              capturedAt: $capturedAt,
              services: {
                arbor: { repo: "forestrie/arbor", ref: $tag, dockerTag: $tag }
              }
            }' > release-metadata/release-fragment.jsonc
          cat release-metadata/release-fragment.jsonc

      - name: Upload release fragment
        uses: actions/upload-artifact@v4
        with:
          name: release-fragment
          path: release-metadata/release-fragment.jsonc
          retention-days: 90
          if-no-files-found: error

      - name: Create annotated tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping tag push"
          else
            git tag -a "$TAG" -m "Orchestrator release $TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Orchestrator-driven release (run ${{ github.event.inputs.orchestrator_run_id }})."
          fi
