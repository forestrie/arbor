name: Release

# Semver v* tag: build, test, and publish images only. Ledger-b GitOps bumps
# are owned by release-orchestrator (FOR-254 / ARC-0025); this workflow no
# longer opens arbor-flux promotion PRs.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and validate semver tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/}"
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Release tag must be semver vX.Y.Z (optional prerelease/build metadata), got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git Bootstrap
        run: task bootstrap

      - name: Unit Tests
        run: task test:unit

      - name: Integration Tests
        run: task test:integration

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT || format('{0}-github-ci@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID || 'forest-dev-1') }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev

      - name: Build and push release images
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: |
          set -euo pipefail
          for service in ranger scout sealer custodian; do
            task release:build-push SERVICE="$service"
          done
