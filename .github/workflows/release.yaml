name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and validate semver tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/}"
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Release tag must be semver vX.Y.Z (optional prerelease/build metadata), got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git Bootstrap
        run: task bootstrap

      - name: Unit Tests
        run: task test:unit

      - name: Integration Tests
        run: task test:integration

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT || format('{0}-github-ci@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID || 'forest-dev-1') }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev

      - name: Build and push release images
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
        run: |
          set -euo pipefail
          for service in ranger scout sealer custodian; do
            task release:build-push SERVICE="$service"
          done

  create-release-pr:
    name: Create Release PR
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ vars.GITAPP_ID }}
          private_key: ${{ secrets.GITAPP_PRIVATE_KEY }}

      - name: Checkout arbor-flux
        uses: actions/checkout@v4
        with:
          repository: forestrie/arbor-flux
          token: ${{ steps.app-token.outputs.token }}

      - name: Install yq
        uses: mikefarah/yq@master

      - name: Update arbor-flux image tags for release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          bump_if_present() {
            local file=$1
            if [ -f "$file" ]; then
              yq eval ".images[0].newTag = \"$VERSION\"" -i "$file"
              echo "updated $file"
            fi
          }

          for svc in ranger sealer scout custodian; do
            bump_if_present "clusters/ledger-b/services/${svc}/kustomization.yaml"
            bump_if_present "clusters/gke-prod/services/${svc}/kustomization.yaml"
          done

          git config user.name "forestrie-cd[bot]"
          git config user.email "forestrie-cd[bot]@users.noreply.github.com"
          git checkout -b "release/${VERSION}"

          git add clusters/ledger-b/services/custodian/kustomization.yaml \
            clusters/ledger-b/services/ranger/kustomization.yaml \
            clusters/ledger-b/services/scout/kustomization.yaml \
            clusters/ledger-b/services/sealer/kustomization.yaml

          if [ -d clusters/gke-prod/services ]; then
            git add clusters/gke-prod/services || true
          fi

          if git diff --cached --quiet; then
            echo "No image tag changes to commit (check arbor-flux paths)" >&2
            exit 1
          fi

          git commit -m "chore: release ${VERSION} (ledger-b; gke-prod when present)" \
            -m "Source: forestrie/arbor@${{ github.sha }}"

          git push origin "release/${VERSION}"

      - name: Create PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh pr create \
            --repo forestrie/arbor-flux \
            --base main \
            --head "release/${VERSION}" \
            --title "Release ${VERSION} (ledger-b)" \
            --body "Bumps pinned images for slot B (\`clusters/ledger-b\`) to **${VERSION}**.

          When \`clusters/gke-prod\` exists in this repo, those manifests are updated too.

          Source commit: forestrie/arbor@${{ github.sha }}

          Merge to roll out promoted images."
